name: Sync B2C OAuth client credentials

# central-app-registration rotates pre-b2c-client-<env> secrets and writes them to central-app-reg-kv.
# B2C holds its own copy in the B2C_1A_PREOAuthClientId/Secret policy keys, so it must be updated after every rotation.
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Upload even if the B2C key already looks up to date'
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        env: [dev, stg, test, demo, prod]
    concurrency:
      group: b2c-sync-${{ matrix.env }}
      cancel-in-progress: false
    steps:
      # Needs a federated credential for this repo and Key Vault Secrets User on the two secrets in central-app-reg-kv.
      - name: Azure login (central-app-reg-kv)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CENTRAL_APP_REG_KV_CLIENT_ID }}
          tenant-id: ${{ vars.CENTRAL_APP_REG_KV_TENANT_ID }}
          subscription-id: 6c4d2513-a873-41b4-afdd-b05a33206631

      - name: Sync policy keys to B2C
        env:
          ENV: ${{ matrix.env }}
          FORCE: ${{ inputs.force }}
          B2C_CLIENT_ID: ${{ secrets[format('PRE_MANAGEMENT_APP_CLIENT_ID_{0}', matrix.env)] }}
          B2C_CLIENT_SECRET: ${{ secrets[format('PRE_MANAGEMENT_APP_CLIENT_SECRET_{0}', matrix.env)] }}
        run: |
          set -euo pipefail

          KV=central-app-reg-kv
          TENANT="hmcts${ENV}extid.onmicrosoft.com"
          GRAPH=https://graph.microsoft.com/beta/trustFramework/keySets

          kv_value()   { az keyvault secret show --vault-name "$KV" -n "$1" --query value -o tsv; }
          kv_attr()    { az keyvault secret show --vault-name "$KV" -n "$1" --query "attributes.$2" -o tsv; }

          SECRET=$(kv_value "pre-b2c-client-${ENV}-secret")
          APP_ID=$(kv_value "pre-b2c-client-${ENV}-app-id")
          echo "::add-mask::$SECRET"
          echo "::add-mask::$APP_ID"

          CREATED=$(date -u -d "$(kv_attr "pre-b2c-client-${ENV}-secret" created)" +%s)
          EXPIRES_RAW=$(kv_attr "pre-b2c-client-${ENV}-secret" expires)
          EXPIRES=$([ -n "$EXPIRES_RAW" ] && date -u -d "$EXPIRES_RAW" +%s || echo $(( $(date -u +%s) + 31536000 )))

          TOKEN=$(curl -sf -X POST "https://login.microsoftonline.com/${TENANT}/oauth2/v2.0/token" \
            -d grant_type=client_credentials -d client_id="$B2C_CLIENT_ID" \
            --data-urlencode client_secret="$B2C_CLIENT_SECRET" \
            -d scope=https://graph.microsoft.com/.default | jq -r .access_token)
          echo "::add-mask::$TOKEN"

          sync_key() {
            local name="$1" value="$2" id="B2C_1A_$1"
            local code newest
            code=$(curl -s -o /tmp/keyset.json -w '%{http_code}' -H "Authorization: Bearer $TOKEN" "$GRAPH/$id")
            if [ "$code" = 404 ]; then
              curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                -d "{\"id\":\"$name\"}" "$GRAPH" > /dev/null
              newest=0
            elif [ "$code" = 200 ]; then
              newest=$(jq '[.keys[]?.nbf // 0] | max // 0' /tmp/keyset.json)
            else
              echo "Unexpected HTTP $code reading $id"; exit 1
            fi

            if [ "$newest" -ge "$CREATED" ] && [ "$FORCE" != true ]; then
              echo "$id is up to date (newest key nbf=$newest >= Key Vault secret created=$CREATED)"
              return
            fi

            jq -n --arg k "$value" --argjson nbf $(( $(date -u +%s) - 300 )) --argjson exp "$EXPIRES" \
              '{use:"sig", k:$k, nbf:$nbf, exp:$exp}' |
              curl -sf -X POST -H "Authorization: Bearer $TOKEN" -H 'Content-Type: application/json' \
                --data @- "$GRAPH/$id/uploadSecret" > /dev/null
            echo "Uploaded new key to $id"
          }

          sync_key PREOAuthClientSecret "$SECRET"
          sync_key PREOAuthClientId "$APP_ID"
